; PCCaffeine KBD — see spec.md
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32 @ ^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
    ; Multi-host (spec §3): 3 simultaneous hosts, 5 remembered bonds,
    ; enough CCCD slots for every host to subscribe to input + battery.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -DCONFIG_BT_NIMBLE_MAX_BONDS=5
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=16
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.1
    olikraus/U8g2 @ ^2.36.18
; Unit tests run on the host only (env:native).
test_ignore = *
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<lib/>

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
